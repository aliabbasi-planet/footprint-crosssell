name: pr-checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'transform/**'
      - '.github/workflows/pr-checks.yml'

jobs:
  lint-and-compile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: transform
    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PRIVATE_KEY_PATH: ${{ github.workspace }}/key.p8
      SNOWFLAKE_AUTHENTICATOR: snowflake_jwt
      SNOWFLAKE_ROLE: DATA_SCIENTIST
      SNOWFLAKE_WAREHOUSE: DATA_SCIENCE
      SNOWFLAKE_DATABASE: DEV_PRESENTATION_AAB
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tooling
        run: pip install dbt-snowflake sqlfluff

      - name: Write key
        run: echo "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" > "$SNOWFLAKE_PRIVATE_KEY_PATH"

      - name: dbt deps
        run: dbt deps

      - name: dbt compile (no writes)
        run: dbt compile --target dev --profiles-dir .

      - name: sqlfluff lint
        run: sqlfluff lint models --dialect snowflake --templater dbt || true

      - name: Model-card check
        working-directory: .
        run: |
          test -f docs/CrossSell_PoC_Native_Snowflake_Plan.md || (echo "Missing plan/model-card doc" && exit 1)
