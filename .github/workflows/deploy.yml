name: deploy

on:
  push:
    branches: [main]          # -> UAT
    tags: ['v*']              # -> PROD (after approval env gate)

jobs:
  # Provenance gate runs first so no un-sourced external data can ever deploy.
  provenance-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate external seeds carry source_url + as_of
        run: |
          python agent/option_a_discovery/validate_candidates.py --schema country_units transform/seeds/ext_country_units.csv
          python agent/option_a_discovery/validate_candidates.py --schema brand_totals  transform/seeds/ext_brand_totals.csv
          python agent/option_a_discovery/validate_candidates.py --schema operator_map  transform/seeds/ext_operator_map.csv

  build:
    needs: provenance-gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: transform
    # 'main' pushes deploy to UAT; version tags deploy to PROD via the protected env.
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'prod' || 'uat' }}
    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PRIVATE_KEY_PATH: ${{ github.workspace }}/key.p8
      SNOWFLAKE_AUTHENTICATOR: snowflake_jwt
      SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_ROLE }}
      SNOWFLAKE_WAREHOUSE: DATA_SCIENCE
      SNOWFLAKE_DATABASE: ${{ vars.SNOWFLAKE_DATABASE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install "dbt-snowflake>=1.9.0"
      - name: Write key
        run: echo "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" > "$SNOWFLAKE_PRIVATE_KEY_PATH"
      - name: dbt build (seeds + models + snapshots + tests)
        run: |
          TARGET=${{ startsWith(github.ref, 'refs/tags/v') && 'prod' || 'uat' }}
          dbt deps
          # Option A only. To include licensed tiers once approved, add them here, e.g.:
          #   --vars '{"enabled_source_tiers": ["A","B"]}'
          dbt build --target "$TARGET" --profiles-dir .
      - name: Summary
        if: always()
        run: echo "Deployed Footprint Cross-Sell (Option A) to the ${{ startsWith(github.ref, 'refs/tags/v') && 'PROD' || 'UAT' }} environment."
