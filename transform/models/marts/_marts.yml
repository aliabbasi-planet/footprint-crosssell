version: 2

models:
  - name: mart_footprint_coverage
    description: "Portfolio coverage per merchant: Planet served stores/countries vs brand published totals, with coverage ratios and brand source."
    columns:
      - name: merchant
        data_tests: [not_null, unique]
      - name: brand_source_url
        data_tests: [not_null]

  - name: mart_country_whitespace
    description: "Per merchant x country white-space, valued with Planet's own per-store economics at 100%/25%/10% capture. Every row carries its external source."
    columns:
      - name: merchant
        data_tests: [not_null]
      - name: country
        data_tests: [not_null]
      - name: source_url
        data_tests: [not_null]
      - name: gap_kind
        description: "DEPTH = Planet active in the country; WIN_BACK = only decommissioned terminals; NEW_COUNTRY = never served."
        data_tests:
          - accepted_values:
              arguments:
                values: ['DEPTH', 'WIN_BACK', 'NEW_COUNTRY']

  - name: mart_operator_opportunities
    description: "Actionable ranked list: operator x merchant x country, with existing-relationship flag, un-served gap, and conservative value."
    columns:
      - name: merchant
        data_tests: [not_null]
      - name: operator_name
        data_tests: [not_null]
      - name: opportunity_type
        data_tests:
          - accepted_values:
              arguments:
                values:
                  ['EXPAND_EXISTING_RELATIONSHIP', 'WARM_INTRO_EXISTING_OPERATOR', 'PORTFOLIO_RELATIONSHIP',
                   'KNOWN_COUNTRY_NEW_OPERATOR', 'NEW_OPERATOR_NEW_COUNTRY']
      - name: gap_status
        description: "OPEN_GAP = sourced un-served units; FULLY_COVERED = no gap; UNSIZED = brand country count not yet sourced (discovery task); PORTFOLIO = global relationship row."
        data_tests:
          - accepted_values:
              arguments:
                values: ['OPEN_GAP', 'FULLY_COVERED', 'UNSIZED', 'PORTFOLIO']
      - name: priority_rank
        data_tests: [not_null, unique]

  - name: mart_merchant_narratives
    description: "Grounded AI_COMPLETE commercial briefing per merchant, fed only computed facts (no fabrication)."
    columns:
      - name: merchant
        data_tests: [not_null, unique]
