version: 2

models:
  - name: stg_ccl_customer
    description: "CCL bridge rows for the 9 PoC merchants, tagged with canonical merchant/vertical."
    columns:
      - name: sf_account_id
        description: "The single cross-source bridge key."
      - name: uid
        description: "Per-source location identifier."
      - name: data_source
        tests:
          - not_null
  - name: stg_ccc_customer
    description: "3C location detail for PoC locations."
    columns:
      - name: location_no
        tests: [not_null]
  - name: stg_ccc_transaction
    description: "3C gateway volume + DCC signals per location and terminal type."
  - name: stg_mas_transaction
    description: "MAS acquiring volume + DCC signals per merchant_id."
    columns:
      - name: merchant_id
        tests: [not_null]
  - name: stg_ccl_revenue
    description: "Revenue by product for PoC merchants — share-of-wallet source."
  - name: stg_tf_stores
    description: "Tax Free store master mapped to CCL UID."
  - name: stg_sf_opportunity
    description: "Open Salesforce opportunities for suppression."
