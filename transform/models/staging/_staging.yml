version: 2

models:
  - name: stg_ccl_customer
    description: "CCL bridge: cleaned 1:1 passthrough of DIM_CCL_CUSTOMER. Merchant tagging happens downstream in int_brand_resolution."
    columns:
      - name: sf_account_id
        description: "The single cross-source bridge key."
      - name: uid
        description: "Per-source location identifier."
      - name: raw_brand
        description: "Raw BRAND string; one of the fields matched by int_brand_resolution."
      - name: customer_name
        description: "Raw CUSTOMER_NAME; matched by int_brand_resolution (captures sub-brands)."
      - name: data_source
        data_tests:
          - not_null

  - name: stg_ccl_revenue
    description: "Location-level revenue by PRODUCT (CURATED_CCL_REVENUE). Attributed to merchants downstream via int_brand_resolution on UID."
    columns:
      - name: uid
        data_tests:
          - not_null

  # The 3C / MAS / Tax-Free / Salesforce staging models served only the superseded
  # estate + eligibility design and now live (disabled) under models/_legacy/staging.
